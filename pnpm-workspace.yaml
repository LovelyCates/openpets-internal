packages:
  - "apps/*"
  - "packages/*"
# Integration hosts are supplied by their owning applications, never bundled peers.
autoInstallPeers: false
supportedArchitectures:
  os:
    - darwin
    - win32
    - linux
  cpu:
    - x64
    - arm64
  libc:
    - glibc
allowBuilds:
  '@scarf/scarf': false
  '@google/genai': true
  '@vscode/vsce-sign': true
  electron-winstaller: false
  electron: true
  esbuild: true
  get-windows: true
  keytar: true
  koffi: true
  msgpackr-extract: true
  openclaw: false
  protobufjs: true
  sharp: true
  tree-sitter-bash: false
  workerd: true
minimumReleaseAgeExclude:
  - electron@45.3.3
  - minimatch@11.0.9
overrides:
  'glob@>=9 <14.0.2': 14.0.6
  'minimatch@>=7 <11.0.1': 11.0.9
  '@vercel/routing-utils>path-to-regexp': 6.3.0
  '@tailwindcss/typography>postcss-selector-parser': 6.1.5
