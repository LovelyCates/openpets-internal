name: Build Internal Windows release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Exact source commit or tag shared with the macOS build"
        required: true
        type: string

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Preserve repository bytes on Windows
        shell: pwsh
        run: git config --global core.autocrlf false

      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          submodules: recursive
          fetch-depth: 1

      - name: Checkout release verification tools
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .local/release-tools
          sparse-checkout: internal/record-release-payload.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pinned pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.8

      - name: Sync an exclusively owned temporary fixture
        shell: node {0}
        run: |
          const assert = require('node:assert/strict');
          const { mkdtemp, writeFile, readFile, open, rm } = require('node:fs/promises');
          const { tmpdir } = require('node:os');
          const { join } = require('node:path');

          (async () => {
            const report = { node: process.version, platform: process.platform, arch: process.arch, results: [], status: 'incomplete' };
            let directory;
            try {
              assert.equal(process.platform, 'win32');
              assert.equal(process.versions.node.split('.')[0], '24');
              directory = await mkdtemp(join(tmpdir(), 'openpets-fsync-probe-'));
              const fixture = join(directory, 'fixture.txt');
              const original = Buffer.from('openpets-fsync-fixture\n');
              await writeFile(fixture, original, { flag: 'wx' });
              for (const flags of ['r', 'r+']) {
                const result = { flags, opened: false, syncSucceeded: false };
                let handle;
                try {
                  handle = await open(fixture, flags);
                  result.opened = true;
                  await handle.sync();
                  result.syncSucceeded = true;
                } catch (error) {
                  result.errorCode = error.code ?? null;
                } finally {
                  await handle?.close();
                }
                const after = await readFile(fixture);
                result.bytes = after.length;
                result.nonTruncating = after.equals(original);
                report.results.push(result);
                assert.ok(result.nonTruncating, `${flags} changed the fixture contents.`);
              }
              assert.ok(report.results.find(result => result.flags === 'r+').syncSucceeded, 'The read/write handle could not sync.');
              report.status = 'passed';
            } catch (error) {
              report.status = 'failed';
              report.error = error.message;
              process.exitCode = 1;
            } finally {
              if (directory) {
                try {
                  await rm(directory, { recursive: true, force: false });
                  report.ownedTemporaryDirectoryRemoved = true;
                } catch (error) {
                  report.ownedTemporaryDirectoryRemoved = false;
                  report.cleanupErrorCode = error.code ?? null;
                  report.status = 'failed';
                  process.exitCode = 1;
                }
              }
              console.log(JSON.stringify(report, null, 2));
            }
          })().catch(error => { console.error(error); process.exitCode = 1; });

      - name: Install locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile

      - name: Prepare verified Windows resource tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:ELECTRON_BUILDER_CACHE = Join-Path $env:RUNNER_TEMP 'electron-builder-cache'
          "ELECTRON_BUILDER_CACHE=$env:ELECTRON_BUILDER_CACHE" >> $env:GITHUB_ENV
          $archive = Join-Path $env:RUNNER_TEMP 'winCodeSign-2.6.0.7z'
          Invoke-WebRequest -Uri 'https://github.com/electron-userland/electron-builder-binaries/releases/download/winCodeSign-2.6.0/winCodeSign-2.6.0.7z' -OutFile $archive
          $sevenZip = node -e "console.log(require('./apps/desktop/node_modules/7zip-bin').path7za)"
          if ($LASTEXITCODE -ne 0) { throw 'Could not locate the locked 7zip executable.' }
          ./internal/Prepare-WindowsCodeSignCache.ps1 -ArchivePath $archive -SevenZipPath $sevenZip
          pnpm --filter @open-pets/desktop package:preflight
          if ($LASTEXITCODE -ne 0) { throw 'Windows packaging prerequisites failed.' }

      - name: Build and check shared integration code
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @open-pets/desktop typecheck
          pnpm --filter @open-pets/client check
          pnpm --filter @open-pets/pet-format test
          pnpm --filter @open-pets/opencode check
          pnpm --filter @open-pets/opencode build:v1
          pnpm --filter @open-pets/opencode build:v2
          git diff --exit-code -- packages/opencode/v1-package/index.js packages/opencode/v2-package/index.js
          pnpm --filter @open-pets/desktop build
          pnpm --filter @open-pets/desktop test:build
          node --test internal/validate-windows-pet-rendering.test.mjs

      # Run the shared release and security regressions on the native Windows host.
      # Transport/encryption fixtures stay isolated; production policy is unchanged.
      - name: Check shared pet and import behavior
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:OPENPETS_DESKTOP_ROOT = Join-Path $env:GITHUB_WORKSPACE 'apps/desktop'
          $tests = @(
            'pet-body-classic-cadence', 'pet-drag-feedback', 'pet-body-state',
            'pet-content-stage', 'pet-window-motion', 'pet-window-interaction-recovery',
            'pet-activities-runtime', 'opencode-token-rate',
            'control-center-route', 'control-center-plugin-ipc',
            'plugin-sdk-bridge', 'plugin-install-durability', 'plugin-install-transaction',
            'plugin-service', 'plugin-service-path-boundaries',
            'default-pet-check-in-startup',
            'bundled-plugin-interactions',
            'pet-library-state', 'preference-patch', 'pet-local-codex-origin',
            'control-center-pet-management-ipc', 'app-state-installed-pets',
            'pet-render-preferences', 'local-ipc-request-handler',
            'logger-storage', 'logger-redaction', 'private-storage', 'plugin-host-clipboard',
            'startup-backend-policy',
            'internal-ipc-paths', 'internal-network-policy', 'codex-pets',
            'codex-local-previews', 'pet-motion-package-validation', 'pet-install-transaction'
          )
          foreach ($name in $tests) {
            node "apps/desktop/.test-dist/tests/$name.test.js"
            if ($LASTEXITCODE -ne 0) { throw "Release behavior check failed: $name" }
          }

      - name: Package Windows x64 application
        shell: bash
        run: |
          set -euo pipefail
          node apps/desktop/scripts/clean-package-output.cjs
          pnpm --dir apps/desktop exec electron-builder --win dir --x64 --publish never
          node apps/desktop/dist/check-packaging-contract.js --output --output-dir apps/desktop/dist-electron/win-unpacked --platform win32 --arch x64
          node internal/validate-windows-runtime.mjs apps/desktop/dist-electron/win-unpacked
          pnpm --dir apps/desktop exec electron-builder --win nsis --x64 --prepackaged dist-electron/win-unpacked --publish never

      - name: Extract and validate the actual NSIS payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = node -p "require('./apps/desktop/package.json').version"
          $installer = Join-Path $env:GITHUB_WORKSPACE "apps/desktop/dist-electron/OpenPets-Internal-$version-win-x64-setup.exe"
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) { throw 'Expected NSIS installer was not produced.' }
          $sevenZip = node -e "console.log(require('./apps/desktop/node_modules/7zip-bin').path7za)"
          # The locked compact 7za binary does not decode the NSIS shell; it
          # otherwise scans ahead and opens the embedded app archive directly.
          # Use the runner's full 7-Zip for the shell, forcing its NSIS decoder.
          $nsisSevenZip = (Get-Command 7z.exe -CommandType Application -ErrorAction Stop).Source
          $extracted = Join-Path $env:RUNNER_TEMP 'openpets-nsis-extracted'
          & $nsisSevenZip x -tNsis $installer "-o$extracted" -y
          if ($LASTEXITCODE -ne 0) { throw 'Could not extract the NSIS installer.' }
          $archives = @(Get-ChildItem -Path $extracted -Recurse -Filter 'app-64.7z')
          if ($archives.Count -ne 1) { throw 'Expected exactly one x64 app archive in NSIS.' }
          $app = Join-Path $env:RUNNER_TEMP 'openpets-nsis-app'
          & $sevenZip x $archives[0].FullName "-o$app" -y
          if ($LASTEXITCODE -ne 0) { throw 'Could not extract the NSIS app payload.' }
          node apps/desktop/dist/check-packaging-contract.js --output --output-dir $app --platform win32 --arch x64
          if ($LASTEXITCODE -ne 0) { throw 'The actual NSIS payload failed its packaging contract.' }
          node internal/validate-windows-runtime.mjs $app
          if ($LASTEXITCODE -ne 0) { throw 'The actual NSIS payload failed its native runtime smoke.' }
          # Start the real packaged GUI, without Node mode or a test carrier.
          # The validator refuses any existing profile and persistent runner.
          node internal/validate-windows-pet-rendering.mjs $app --output (Join-Path $env:RUNNER_TEMP 'openpets-native-rendering') --with-public-yukino
          if ($LASTEXITCODE -ne 0) { throw 'The actual NSIS payload failed its native V1/V2 rendering gate.' }
          $renderReport = Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'openpets-native-rendering/WINDOWS-PET-RENDERING.json') -Raw | ConvertFrom-Json
          "Supplementary SHA-pinned public Yukino native rendering: $($renderReport.publicYukino.status)." >> $env:GITHUB_STEP_SUMMARY
          if ($renderReport.publicYukino.status -ne 'passed') { Write-Warning 'Public Yukino source was unavailable or changed; its playback is not verified by this run. Required synthetic V1/V2 checks passed.' }
          node .local/release-tools/internal/record-release-payload.mjs --source-root $env:GITHUB_WORKSPACE --resources-dir (Join-Path $app 'resources') --platform win32 --arch x64 --output apps/desktop/dist-electron/BUILD-METADATA.windows-x64.json
          if ($LASTEXITCODE -ne 0) { throw 'Could not record the verified payload metadata.' }
          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $([System.IO.Path]::GetFileName($installer))" | Set-Content -Encoding utf8NoBOM apps/desktop/dist-electron/SHA256SUMS.windows-x64.txt
          "version=$version" >> $env:GITHUB_ENV
          "source_sha=$(git rev-parse HEAD)" >> $env:GITHUB_ENV
          "Windows x64 NSIS payload, native runtime and actual packaged V1/V2 idle rendering validated; version $version; source $(git rev-parse HEAD). Hosted renderer evidence is not a user GPU or DWM smoothness measurement. Installer is unsigned." >> $env:GITHUB_STEP_SUMMARY

      - name: Preserve actual Windows pet rendering evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openpets-windows-native-rendering-${{ github.run_id }}
          path: ${{ runner.temp }}/openpets-native-rendering/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload verified installer and provenance
        uses: actions/upload-artifact@v4
        with:
          name: openpets-internal-windows-x64-${{ env.version }}-${{ env.source_sha }}
          path: |
            apps/desktop/dist-electron/OpenPets-Internal-${{ env.version }}-win-x64-setup.exe
            apps/desktop/dist-electron/SHA256SUMS.windows-x64.txt
            apps/desktop/dist-electron/BUILD-METADATA.windows-x64.json
          if-no-files-found: error
          retention-days: 14
