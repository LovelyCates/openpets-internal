name: Probe native Windows file sync

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fsync-probe:
    if: github.repository == 'LovelyCates/openpets-internal'
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Sync an exclusively owned temporary fixture
        shell: node {0}
        run: |
          const assert = require('node:assert/strict');
          const { mkdtemp, writeFile, readFile, open, rm } = require('node:fs/promises');
          const { tmpdir } = require('node:os');
          const { join } = require('node:path');

          (async () => {
            const report = { node: process.version, platform: process.platform, arch: process.arch, results: [], status: 'incomplete' };
            let directory;
            try {
              assert.equal(process.platform, 'win32');
              assert.equal(process.versions.node.split('.')[0], '24');
              directory = await mkdtemp(join(tmpdir(), 'openpets-fsync-probe-'));
              const fixture = join(directory, 'fixture.txt');
              const original = Buffer.from('openpets-fsync-fixture\n');
              await writeFile(fixture, original, { flag: 'wx' });
              for (const flags of ['r', 'r+']) {
                const result = { flags, opened: false, syncSucceeded: false };
                let handle;
                try {
                  handle = await open(fixture, flags);
                  result.opened = true;
                  await handle.sync();
                  result.syncSucceeded = true;
                } catch (error) {
                  result.errorCode = error.code ?? null;
                } finally {
                  await handle?.close();
                }
                const after = await readFile(fixture);
                result.bytes = after.length;
                result.nonTruncating = after.equals(original);
                report.results.push(result);
                assert.ok(result.nonTruncating, `${flags} changed the fixture contents.`);
              }
              assert.ok(report.results.find(result => result.flags === 'r+').syncSucceeded, 'The read/write handle could not sync.');
              report.status = 'passed';
            } catch (error) {
              report.status = 'failed';
              report.error = error.message;
              process.exitCode = 1;
            } finally {
              if (directory) {
                try {
                  await rm(directory, { recursive: true, force: false });
                  report.ownedTemporaryDirectoryRemoved = true;
                } catch (error) {
                  report.ownedTemporaryDirectoryRemoved = false;
                  report.cleanupErrorCode = error.code ?? null;
                  report.status = 'failed';
                  process.exitCode = 1;
                }
              }
              console.log(JSON.stringify(report, null, 2));
            }
          })().catch(error => { console.error(error); process.exitCode = 1; });
