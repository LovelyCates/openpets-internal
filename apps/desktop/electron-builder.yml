appId: dev.openpets.internal
productName: OpenPets Internal
executableName: openpets-internal
copyright: Copyright © 2026 OpenPets

directories:
  output: dist-electron

artifactName: OpenPets-Internal-${version}-${os}-${arch}.${ext}

files:
  - dist/**
  - control-center-preload.cjs
  - pet-tts-helper.cjs
  - plugin-sdk-preload.cjs
  - plugin-command-form-preload.cjs
  - panel-preload.cjs
  - voice-realtime-preload.cjs
  - assets/**
  - package.json

extraResources:
  - from: ../../plugins/official/openpets.reminders
    to: plugins/official/openpets.reminders
  - from: ../../plugins/official/openpets.simple-timer
    to: plugins/official/openpets.simple-timer
  - from: ../../plugins/official/openpets.focus-buddy
    to: plugins/official/openpets.focus-buddy
  - from: ../../plugins/official/openpets.launch-buddy
    to: plugins/official/openpets.launch-buddy
  - from: ../../plugins/official/openpets.fortune-cookie
    to: plugins/official/openpets.fortune-cookie
  - from: ../../plugins/official/openpets.virtual-pet
    to: plugins/official/openpets.virtual-pet
  - from: ../../plugins/official/openpets.system-resources
    to: plugins/official/openpets.system-resources

asar: true
asarUnpack:
  - node_modules/**
npmRebuild: false
publish: null
afterPack: scripts/wait-windows-resource-edit.cjs

toolsets:
  appimage: 1.0.3

mac:
  icon: assets/app-icon.icns
  category: public.app-category.utilities
  extendInfo:
    NSMicrophoneUsageDescription: OpenPets uses your microphone only for user-initiated one-shot input and realtime voice conversations.
  target:
    - dmg
    - zip
  # Ad-hoc sign macOS bundles when a Developer ID certificate is unavailable.
  # Leaving the app bundle fully unsigned can produce Gatekeeper's misleading
  # "damaged and can't be opened" dialog on Apple Silicon releases.
  identity: "-"
  hardenedRuntime: false
  gatekeeperAssess: false

win:
  icon: assets/app-icon.ico
  target:
    - nsis
  verifyUpdateCodeSignature: false

nsis:
  artifactName: OpenPets-Internal-${version}-win-${arch}-setup.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
linux:
  icon: assets/app-icon.png
  target:
    - AppImage
    - deb
    - rpm
    - tar.gz
  category: Utility
  maintainer: OpenPets
